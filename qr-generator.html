<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator — Business Card</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       QR GENERATOR PAGE STYLES
       Clean, utilitarian — its only job is to produce the PNG
       ============================================================ */

    :root {
      --green:      #198754;
      --green-dark: #136740;
      --green-light:#e9f5ee;
      --white:      #ffffff;
      --off-white:  #f8faf9;
      --text:       #111827;
      --muted:      #6b7280;
      --shadow:     0 8px 32px rgba(0,0,0,.10);
      --font-display:'Playfair Display', Georgia, serif;
      --font-body:  'DM Sans', system-ui, sans-serif;
      --radius:     20px;
      --transition: all .25s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--off-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-image:
        radial-gradient(circle at 20% 80%, rgba(25,135,84,.07) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(25,135,84,.05) 0%, transparent 50%);
    }

    /* ── Page card ── */
    .page-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 40px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      animation: cardIn .5s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── Page heading ── */
    .page-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 36px;
    }

    /* ── Divider ── */
    .divider {
      width: 36px; height: 2px;
      background: var(--green); border-radius: 2px;
      margin: 0 auto 32px; opacity: .4;
    }

    /* ── Logo area ── */
    .logo-area {
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }

    #company-logo {
      max-height: 80px;
      max-width: 260px;
      object-fit: contain;
    }

    /* Placeholder shown when logo image fails */
    #logo-placeholder {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      background: var(--green-light);
      border-radius: 12px;
      border: 2px dashed rgba(25,135,84,.3);
    }

    #logo-placeholder p {
      font-size: .78rem;
      color: var(--green-dark);
      opacity: .7;
    }

    /* ── QR Code container ── */
    .qr-wrapper {
      display: inline-block;
      padding: 16px;
      background: var(--white);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      margin-bottom: 36px;
    }

    #qr-container canvas,
    #qr-container img {
      display: block;
      border-radius: 6px;
    }

    /* Loading state */
    .qr-loading {
      width: 240px; height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: .85rem;
    }

    /* ── URL display ── */
    .qr-url {
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 28px;
      word-break: break-all;
    }

    .qr-url strong {
      color: var(--green);
      font-weight: 600;
    }

    /* ── Download button ── */
    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 36px;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(25,135,84,.3);
      transition: var(--transition);
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-download:hover {
      background: var(--green-dark);
      box-shadow: 0 6px 22px rgba(25,135,84,.4);
      transform: translateY(-2px);
    }

    .btn-download:active {
      transform: translateY(0);
    }

    .btn-download svg {
      width: 18px; height: 18px; flex-shrink: 0;
    }

    /* ── Back link ── */
    .back-link {
      display: block;
      margin-top: 20px;
      font-size: .82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }

    .back-link:hover { color: var(--green); }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .page-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <div class="page-card">

    <h1 class="page-title">QR Code Generator</h1>
    <p  class="page-subtitle">Generate a printable QR code for your physical business card</p>
    <div class="divider"></div>

    <!-- Company Logo (only on this page — NOT on index.html) -->
    <div class="logo-area">
      <img id="company-logo" src="" alt="Company Logo" />
      <div id="logo-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#198754" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <p>Add company logo to<br><code>assets/company-logo.png</code></p>
      </div>
    </div>

    <!-- QR Code output -->
    <div class="qr-wrapper">
      <div id="qr-container">
        <div class="qr-loading">Generating QR…</div>
      </div>
    </div>

    <!-- URL being encoded -->
    <p class="qr-url" id="qr-url-display">
      Points to: <strong id="qr-url-text">—</strong>
    </p>

    <!-- Download button -->
    <button class="btn-download" onclick="downloadQR()" type="button" aria-label="Download QR code as PNG">
      <!-- Download icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download QR Code
    </button>

    <a href="index.html" class="back-link">← Back to Digital Card</a>

  </div>

  <!-- QR library — loaded from local libs folder (no CDN dependency) -->
  <script src="libs/qrcode.min.js"></script>

  <!-- QR generator logic -->
  <script src="js/qr-generator.js"></script>

  <!-- Display the URL being encoded -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlEl = document.getElementById("qr-url-text");
      if (urlEl && qrConfig && qrConfig.qrTargetUrl) {
        urlEl.textContent = qrConfig.qrTargetUrl;
      }
    });
  </script>

</body>
</html>
