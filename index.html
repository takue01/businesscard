<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Digital Business Card" />

  <!-- Prevent search engines from indexing personal card pages -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- iOS / Android home-screen meta -->
  <meta name="theme-color" content="#198754" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>Digital Business Card</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================================================
       CARD WRAPPER — constrains max width to phone-like size
       ============================================================ -->
  <div class="card-wrapper">
    <article class="card" role="main" aria-label="Digital Business Card">

      <!-- ========================================================
           PHOTO SECTION
           JS (card.js) injects the <img> or a placeholder here.
           ======================================================== -->
      <div class="photo-section" id="photo-section" aria-label="Profile photo"></div>

      <!-- ========================================================
           CURVED GREEN ACCENT DIVIDER
           SVG wave that visually separates the photo from the info.
           The fill matches the card background (#ffffff).
           The path creates a smooth upward arc in green.
           ======================================================== -->
      <div class="curve-divider" aria-hidden="true">
        <svg
          viewBox="0 0 390 72"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="none"
        >
          <!-- Green wave band behind the arc -->
          <path
            d="M0 0 Q195 72 390 0 L390 72 L0 72 Z"
            fill="#198754"
            opacity="0.12"
          />
          <!-- Crisp green arc stroke -->
          <path
            d="M0 0 Q195 64 390 0"
            fill="none"
            stroke="#198754"
            stroke-width="3"
            opacity="0.7"
          />
        </svg>
      </div>

      <!-- ========================================================
           IDENTITY SECTION
           ======================================================== -->
      <section class="identity-section" aria-label="Contact identity">
        <h1 class="full-name" id="full-name">Loading…</h1>
        <p  class="position-company" id="position-company"></p>
        <p  class="motto" id="motto"></p>
        <div class="divider" aria-hidden="true"></div>
      </section>

      <!-- ========================================================
           ACTION BUTTONS
           ======================================================== -->
      <section class="action-section" aria-label="Contact actions">

        <!-- LinkedIn -->
        <a
          id="btn-linkedin"
          class="btn btn-primary"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open LinkedIn profile"
        >
          <!-- LinkedIn icon (official brand shape) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0z"/>
          </svg>
          LinkedIn
        </a>

        <!-- Website -->
        <a
          id="btn-website"
          class="btn btn-outline"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit company website"
        >
          <!-- Globe icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Website
        </a>

        <!-- Save Contact -->
        <button
          id="btn-save"
          class="btn btn-primary"
          onclick="saveContact()"
          aria-label="Save contact to phone"
          type="button"
        >
          <!-- Person/Contact icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
            <path d="M17 11l2 2 4-4" stroke-width="2"/>
          </svg>
          Save Contact
        </button>

      </section>

      <!-- ========================================================
           SUBTLE CARD FOOTER
           ======================================================== -->
      <footer class="card-footer" aria-label="Card footer">
        <p>Digital Business Card</p>
      </footer>

    </article>
  </div><!-- /.card-wrapper -->

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="js/card.js"></script>

</body>
</html>
